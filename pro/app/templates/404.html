<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            color: #222;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .cat {
            font-size: 100px;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #444;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="cat">🐱</div>

    <h1>404</h1>

    <p>Oops! This page could not be found.</p>

    <a href="/">Go Back Home</a>

</div>

</body>
</html>
